# Publica o site no Firebase Hosting a cada push na branch principal.
# Precisa do segredo FIREBASE_SERVICE_ACCOUNT (chave JSON da conta de serviço).
name: Publicar no Firebase Hosting

on:
  push:
    branches: [claude/project-thread-eq8cdz]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyBZBG0BgZJYyVBYfOb0Wao_zJU8TZ8HM8I
      VITE_FIREBASE_AUTH_DOMAIN: agenda-luiza.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: agenda-luiza
      VITE_FIREBASE_APP_ID: 1:499445008247:web:2f33f354854e010dd0c372
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: agenda-luiza
          channelId: live
